name: Build StarFloat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify required Android resources
        run: |
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/xml/accessibility_config.xml
          test -f app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-mdpi/ic_launcher_round.png

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StarFloat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
