
name: Build Detector Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "detector-pro/gradlew" ]; then
            echo "project_dir=detector-pro" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: gradlew was not found."
            echo "Repository files:"
            ls -la
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: detector-pro-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            detector-pro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
